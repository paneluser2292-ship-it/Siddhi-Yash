ok<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Siddhi ❤️ Yash</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at center,#3b0018,#10000b 55%,#000);
  color:white;
}

.hearts span{
  position:fixed;
  bottom:-40px;
  font-size:25px;
  animation:up 7s linear infinite;
  opacity:.8;
  pointer-events:none;
}

@keyframes up{
  0%{transform:translateY(0) rotate(0);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}

.card{
  width:92%;
  max-width:500px;
  padding:25px 20px;
  text-align:center;
  border:1px solid #ff4d88;
  border-radius:28px;
  background:rgba(20,0,12,.78);
  box-shadow:0 0 30px #ff1765, inset 0 0 30px #330018;
  position:relative;
  z-index:2;
}

h1{
  margin:0;
  font-size:clamp(40px,12vw,72px);
  color:#ff4d88;
  text-shadow:0 0 10px #ff1765,0 0 35px #ff1765;
}

h2{
  font-size:25px;
  margin:10px 0;
}

p{
  font-size:17px;
  line-height:1.6;
  color:#ffd7e5;
}

.photo{
  width:190px;
  height:190px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #ff4d88;
  box-shadow:0 0 25px #ff1765;
  margin:15px auto;
  display:block;
}

button{
  border:0;
  border-radius:30px;
  padding:14px 25px;
  margin-top:8px;
  font-size:16px;
  color:white;
  background:linear-gradient(90deg,#ff1765,#ff4d9d);
  box-shadow:0 0 18px #ff1765;
}

#msg{
  display:none;
  margin-top:18px;
  font-size:18px;
  color:white;
}
</style>
</head>

<body>

<div class="hearts">
<span style="left:10%;animation-delay:0s">❤️</span>
<span style="left:25%;animation-delay:2s">💖</span>
<span style="left:45%;animation-delay:4s">💕</span>
<span style="left:65%;animation-delay:1s">💗</span>
<span style="left:85%;animation-delay:3s">❤️</span>
</div>

<div class="card">

<h1>Yash ❤️ Siddhi</h1>

<img class="photo" src="photo.jpg">

<h2>Our Little Love World 💕</h2>

<p>
Some people make your life beautiful just by being in it.
<br>
You are one of those people. ❤️
</p>

<button onclick="showLove()">Tap Here 💗</button>

<div id="msg">
  ✨ You are special to me forever ❤️ ✨
</div>

</div>

<script>
function showLove(){
  document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
