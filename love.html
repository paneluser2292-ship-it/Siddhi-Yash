<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yash ❤️ Siddhi</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#3b0018,#10000b 55%,#000);
  color:white;
  font-family:Arial,sans-serif;
}
.hearts span{
  position:fixed;
  bottom:-30px;
  font-size:22px;
  animation:up linear infinite;
  opacity:.8;
}
@keyframes up{
  0%{transform:translateY(0) scale(.7);opacity:0}
  20%{opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
.card{
  width:92%;
  max-width:520px;
  padding:35px 22px;
  text-align:center;
  border:1px solid #ff4d88;
  border-radius:28px;
  background:rgba(20,0,12,.75);
  box-shadow:0 0 30px #ff1765, inset 0 0 30px #330018;
  z-index:2;
}
h1{
  margin:0;
  font-size:clamp(42px,12vw,72px);
  color:#ff4d88;
  text-shadow:0 0 10px #ff1765,0 0 35px #ff1765;
}
h2{font-size:25px;margin:10px 0}
p{font-size:17px;line-height:1.6;color:#ffd7e5}
button{
  border:0;
  border-radius:30px;
  padding:14px 25px;
  margin:8px;
  font-size:16px;
  color:white;
  background:linear-gradient(90deg,#ff1765,#ff4d9d);
  box-shadow:0 0 18px #ff1765;
}
#msg{
  display:none;
  margin-top:18px;
  color:#fff;
  font-size:18px;
}
#counter{
  margin-top:15px;
  color:#ff9abd;
  font-size:14px;
}
</style>
</head>

<body>

<div class="hearts">
<span style="left:5%;animation-duration:7s">❤️</span>
<span style="left:18%;animation-duration:9s">💗</span>
<span style="left:32%;animation-duration:6s">💕</span>
<span style="left:48%;animation-duration:10s">❤️</span>
<span style="left:65%;animation-duration:8s">💖</span>
<span style="left:80%;animation-duration:11s">💗</span>
<span style="left:92%;animation-duration:7s">💕</span>
</div>

<div class="card">
<h1>Yash ❤️ Siddhi</h1>
<h2>Forever & Always ✨</h2>

<p>
Some people come into life and make it beautiful.
<br><br>
You are my favourite notification,
my favourite thought,
and my favourite person. ❤️
</p>

<button onclick="showLove()">💌 Open My Heart</button>
<button onclick="moreLove()">✨ Surprise</button>

<div id="msg"></div>

<div id="counter">
Made with ❤️ for Siddhi
</div>
</div>

<script>
function showLove(){
 document.getElementById("msg").style.display="block";
 document.getElementById("msg").innerHTML=
 "Siddhi, no matter how many stars are in the sky,<br>"+
 "you will always be my favourite one. ❤️✨";
}

function moreLove(){
 document.getElementById("msg").style.display="block";
 document.getElementById("msg").innerHTML=
 "Meri Jaan hotty baby 💗";
}
</script>

</body>
</html>
